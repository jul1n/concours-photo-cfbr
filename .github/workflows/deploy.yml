name: Deploy via FTPS
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Sync files
        # Épinglé par SHA : cette action reçoit les identifiants FTP.
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps          # chiffre identifiants et fichiers (FTP simple = clair sur le réseau)
          server-dir: ./www/      # Remplacer par /public_html/ si nécessaire selon l'hébergeur
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .vscode/**
            _LOCAL_ONLY/**
            **/*.md
            **/*.example.php
            data/*.db*
